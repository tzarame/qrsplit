<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Text to QR Codes</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <h2>Text to QR Codes</h2>
        <textarea id="textInput" rows="10" placeholder="Enter your text here"></textarea>

        <label for="lineBreakOption">Select Line Break Symbol:</label>
        <select id="lineBreakOption">
            <option value="none">Do nothing</option>
            <option value="\n">\n</option>
            <option value="¶">¶</option>
            <option value="^N^">^N^</option>
            <option value="\NL" selected>\NL</option>
        </select>

        <label for="chunkSize">Characters per QR code:</label>
        <input type="number" id="chunkSize" min="100" max="2500" value="1000">

        <div style="display: flex; gap: 10px;">
            <button id="generateBtn" style="flex: 1;">Generate QR Codes</button>
            <button id="clearBtn" style="flex: 1; background-color: #e74c3c;">Clear All</button>
        </div>
        <div id="qrCodes"></div>

        <div id="debugBlock">
            <h3>Debug Information</h3>
            <p>Original Characters: <span id="charCount">0</span>, Original Lines: <span id="lineCount">0</span>,
                Original MD5 Hash: <span id="md5Hash">N/A</span></p>
            <p>Modified Characters: <span id="modifiedCharCount">0</span>, Modified Lines: <span
                    id="modifiedLineCount">0</span>, Modified MD5 Hash: <span id="modifiedMd5Hash">N/A</span></p>
            <p>Modified Text with Line Breaks:</p>
            <textarea id="modifiedText" rows="5" readonly></textarea>
            <label for="verticalSpacing">Vertical Spacing Between QR Codes (px):</label>
            <input type="number" id="verticalSpacing" value="500" min="0" max="1000">
        </div>

        <div id="debugCheckboxContainer">
            <label for="debugCheckbox">Debug</label>
            <input type="checkbox" id="debugCheckbox">
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/blueimp-md5/js/md5.min.js"></script>
    <script src="js/script.js"></script>
    <p>v0.3</p>
</body>

</html>
